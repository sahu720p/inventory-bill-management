<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E29D" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#5B3E08" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24211D" />
      <stop offset="100%" stop-color="#141312" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded hexagon/shield -->
  <rect x="8" y="8" width="184" height="184" rx="36" fill="url(#darkBg)" stroke="url(#goldGrad)" stroke-width="3.5"/>
  <rect x="16" y="16" width="168" height="168" rx="28" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>

  <!-- Crown / Royal Crest Top -->
  <path d="M72 58 L82 72 L100 50 L118 72 L128 58 L124 82 L76 82 Z" fill="url(#goldGrad)" filter="url(#goldGlow)"/>
  <circle cx="100" cy="46" r="3.5" fill="#FFF2C6" />
  <circle cx="72" cy="54" r="2.5" fill="#FFF2C6" />
  <circle cx="128" cy="54" r="2.5" fill="#FFF2C6" />

  <!-- Monogram OSV -->
  <text x="100" y="128" font-family="'Cinzel', 'Playfair Display', serif" font-size="44" font-weight="800" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="3" filter="url(#goldGlow)">OSV</text>

  <!-- Decorative Swirl / Thread & Needle flourish -->
  <path d="M50 142 Q 100 156 150 142" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="100" cy="149" r="2.5" fill="url(#goldGrad)" />
  <circle cx="65" cy="145" r="1.5" fill="url(#goldGrad)" />
  <circle cx="135" cy="145" r="1.5" fill="url(#goldGrad)" />

  <!-- Subtitle -->
  <text x="100" y="168" font-family="'Outfit', sans-serif" font-size="9" font-weight="600" fill="#E8D5B5" text-anchor="middle" letter-spacing="4">VASTRALAYA</text>
</svg>
